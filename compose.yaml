name: little-quest
x-api: &api
  build:
    context: .
    dockerfile: infrastructure/Dockerfile.api
    target: production
  restart: unless-stopped
  environment: &api-env
    APP_NAME: Little Quest
    APP_ENV: production
    APP_DEBUG: "false"
    APP_KEY: ${APP_KEY:?Set APP_KEY in the root .env file}
    APP_URL: https://${SITE_DOMAIN:-localhost}
    DB_CONNECTION: pgsql
    DB_HOST: database
    DB_PORT: 5432
    DB_DATABASE: quest
    DB_USERNAME: quest
    DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in the root .env file}
    SESSION_DRIVER: database
    SESSION_SECURE_COOKIE: "true"
    SESSION_SAME_SITE: lax
    CACHE_STORE: database
    QUEUE_CONNECTION: database
    LOG_CHANNEL: stderr
    LOG_LEVEL: warning
    MAIL_MAILER: smtp
    MAIL_HOST: ${MAIL_HOST:-mailpit}
    MAIL_PORT: ${MAIL_PORT:-1025}
    MAIL_USERNAME: ${MAIL_USERNAME:-}
    MAIL_PASSWORD: ${MAIL_PASSWORD:-}
    MAIL_SCHEME: ${MAIL_SCHEME:-smtp}
    MAIL_FROM_ADDRESS: ${MAIL_FROM_ADDRESS:-hello@littlequest.test}
    MAIL_FROM_NAME: Little Quest
  volumes:
    - media:/var/www/html/storage/app/public
  depends_on:
    database:
      condition: service_healthy
services:
  database:
    image: postgres:18
    restart: unless-stopped
    environment:
      POSTGRES_DB: quest
      POSTGRES_USER: quest
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD}
    volumes:
      - postgres:/var/lib/postgresql
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U quest -d quest"]
      interval: 5s
      timeout: 5s
      retries: 15
  api:
    <<: *api
    healthcheck:
      test: [CMD, php, "-r", "exit(@fsockopen('127.0.0.1', 9000) ? 0 : 1);"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
  worker:
    <<: *api
    command:
      [php, artisan, "queue:work", "--sleep=3", "--tries=3", "--timeout=60"]
    depends_on:
      api:
        condition: service_healthy
  web:
    build:
      context: .
      dockerfile: infrastructure/Dockerfile.web
    restart: unless-stopped
    healthcheck:
      test:
        [
          CMD,
          node,
          "-e",
          "fetch('http://127.0.0.1:3000').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s
  proxy:
    image: caddy:2
    restart: unless-stopped
    environment:
      SITE_DOMAIN: ${SITE_DOMAIN:-localhost}
    ports: ["80:80", "443:443", "443:443/udp"]
    volumes:
      - ./infrastructure/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./apps/api/public:/var/www/html/public:ro
      - media:/srv/storage:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      api:
        condition: service_healthy
      web:
        condition: service_healthy
  mailpit:
    image: axllent/mailpit:latest
    profiles: [local-mail]
    ports: ["127.0.0.1:8025:8025"]
  backup:
    image: postgres:18
    restart: unless-stopped
    environment:
      PGHOST: database
      PGUSER: quest
      PGPASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD}
      PGDATABASE: quest
    volumes:
      - ./infrastructure/backup.sh:/backup.sh:ro
      - ./backups:/backups
      - media:/media:ro
    entrypoint: ["/bin/sh", "/backup.sh"]
    depends_on:
      database:
        condition: service_healthy
volumes:
  postgres:
  media:
  caddy_data:
  caddy_config:
