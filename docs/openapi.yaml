      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProfileInput"
  /children/{child}:
    put:
      operationId: update_explorer
      summary: Update explorer
      description: ""
      security:
        - cookieAuth: []
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Child"
        "422":
          description: Validation failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Sign in required
        "403":
          description: Permission or adult reauthentication required
        "404":
          description: Not found
        "409":
          description: The adventure moved on; resume the current state
        "419":
          description: Refresh the CSRF cookie and retry
        "429":
          description: Too many requests
      parameters:
        - name: child
          in: path
          required: true
