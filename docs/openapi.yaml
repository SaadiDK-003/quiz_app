      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProfileInput"
    delete:
      operationId: delete_explorer
      summary: Delete explorer
      description: ""
      security:
        - cookieAuth: []
      responses:
        "204":
          description: Success
        "422":
          description: Validation failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Sign in required
        "403":
          description: Permission or adult reauthentication required
        "404":
          description: Not found
        "409":
          description: The adventure moved on; resume the current state
        "419":
          description: Refresh the CSRF cookie and retry
        "429":
          description: Too many requests
      parameters:
        - name: child
          in: path
          required: true
          schema: *id002
  /children/{child}/enter:
    post:
      operationId: enter_child_mode
      summary: Enter child mode
      description: ""
      security:
        - cookieAuth: []
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Session"
        "422":
          description: Validation failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Sign in required
        "403":
          description: Permission or adult reauthentication required
        "404":
          description: Not found
        "409":
          description: The adventure moved on; resume the current state
        "419":
          description: Refresh the CSRF cookie and retry
        "429":
          description: Too many requests
      parameters:
        - name: child
          in: path
          required: true
          schema: *id002
  /children/{child}/progress:
    get:
      operationId: learning_progress
      summary: Learning progress
      description: ""
      security:
        - cookieAuth: []
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Progress"
        "422":
          description: Validation failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Sign in required
        "403":
          description: Permission or adult reauthentication required
        "404":
          description: Not found
